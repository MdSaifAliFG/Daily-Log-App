kind = "mobile"
previewPath = "/daily-log/"
title = "Daily Log"
description = "A private personal diary and routine tracker for recording each day, reviewing weekly patterns, and understanding monthly momentum from a phone."
version = "1.0.0"
id = "artifacts/daily-log"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/daily-log/" ]
localPort = 23331

[services.development]
run = "pnpm --filter @workspace/daily-log run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daily-log", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/daily-log", "run", "serve" ]

[services.env]
PORT = "23331"
BASE_PATH = "/daily-log/"
